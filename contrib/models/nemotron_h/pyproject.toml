# Installs this folder's src/ as the ``nemotron_h`` package and registers the
# NemotronH architecture with vLLM through a general-plugin entry point:
#     pip install --no-deps -e contrib/models/nemotron_h
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-nemotron-h"
version = "0.1.0"
description = "NVIDIA Nemotron-H (hybrid Mamba-2 + MoE + attention) on vllm-neuron (contrib)"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
nemotron_h = "nemotron_h.plugin:register"

[tool.setuptools]
package-dir = {"nemotron_h" = "src", "nemotron_h.kernels" = "src/kernels"}
packages = ["nemotron_h", "nemotron_h.kernels"]
